version: "3.8"

services:
  app:
    image: ru2ya:local
    build: .
    environment:
      - NODE_ENV=production
      - NODE_OPTIONS=--max-old-space-size=768
      - DATABASE_PATH=/data/ru2ya.db
    ports:
      - "3000:3000"
    volumes:
      - ./data:/data
    mem_limit: 1g
    memswap_limit: 1g
    oom_kill_disable: false
    depends_on:
      - cadvisor

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - cadvisor

  grafana:
    image: grafana/grafana:11.1.0
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
      - influxdb

  influxdb:
    image: influxdb:2.7-alpine
    ports:
      - "8086:8086"
    environment:
      - INFLUXDB_DB=ru2ya
      - INFLUXDB_ADMIN_USER=admin
      - INFLUXDB_ADMIN_PASSWORD=admin
      - INFLUXDB_HTTP_AUTH_ENABLED=true
    volumes:
      - influxdb-storage:/var/lib/influxdb2
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  monika:
    image: hyperjumptech/monika:latest
    ports:
      - "3100:3100"
    volumes:
      - ./monika/monika.json:/home/monika/monika.json:ro
      - ./monika/logs:/home/monika/logs
    environment:
      - MONIKA_LOG_LEVEL=info
    depends_on:
      - app
      - influxdb
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3100/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  grafana-storage:
  influxdb-storage:





